services:
  - type: web
    name: turn2law-lawgpt
    runtime: python
    env: python
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -m data.ingest build-bm25
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RAG_MODE
        value: rag
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-120b
      - key: DEEPINFRA_TOKEN
        sync: false
      - key: EMBEDDING_PROVIDER
        value: deepinfra
      - key: EMBEDDING_MODEL_NAME
        value: Qwen/Qwen3-Embedding-8B
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: lawgpt-qwen3-prod
      - key: PINECONE_NAMESPACE
        value: qwen3-embedding-8b-v1
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_REGION
        value: us-east-1
      - key: BM25_ENABLED
        value: true
      - key: BM25_DATABASE_PATH
        value: storage/bm25_legal_v2.sqlite3
      - key: RERANKER_REQUIRED
        value: true
      - key: RERANKER_PROVIDER
        value: cohere
      - key: RERANKER_MODEL_NAME
        value: rerank-v3.5
      - key: COHERE_API_KEY
        sync: false
      - key: CITATION_VERIFICATION_ENABLED
        value: true
      - key: RETRIEVAL_CANDIDATE_K
        value: 50
      - key: RERANKER_TOP_K
        value: 10
      - key: ALLOWED_ORIGINS
        value: https://turn2law-tan.vercel.app
