services:
  - type: web
    name: turn2law-lawgpt
    runtime: python
    env: python
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEEPINFRA_TOKEN
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: lawgpt-newdata
      - key: PINECONE_NAMESPACE
        value: new-data-v2
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: openai/gpt-oss-20b
      - key: EMBEDDING_MODEL_NAME
        value: intfloat/e5-large-v2
      - key: EMBEDDING_BATCH_SIZE
        value: 8
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: false
      - key: ALLOW_LOCAL_EMBEDDING_FALLBACK
        value: false
      - key: RAG_FALLBACK_ENABLED
        value: true
      - key: DEEPINFRA_TIMEOUT_SECONDS
        value: 8
      - key: RAG_INVOKE_TIMEOUT_SECONDS
        value: 20
      - key: API_REQUEST_TIMEOUT_SECONDS
        value: 50
      - key: WARMUP_ENABLED
        value: false
      - key: RAG_MODE
        value: llm-only
      - key: USER_AGENT
        value: MyLangChainScraper/mk2
