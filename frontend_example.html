<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turn2Law - Legal Query Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .api-url-group {
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
        }

        .api-url-group label {
            font-size: 0.9em;
            color: #666;
        }

        .api-url-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            margin-top: 5px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .response {
            margin-top: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            border-radius: 10px;
            display: none;
        }

        .response.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .response h3 {
            margin-top: 0;
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .response-content {
            color: #555;
            line-height: 1.8;
            white-space: pre-wrap;
            font-size: 1.05em;
        }

        .error {
            border-left-color: #e74c3c;
            background: #fee;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-style: italic;
            margin-top: 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .model-info {
            font-size: 0.9em;
            color: #888;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚖️ Turn2Law</h1>
        <p class="subtitle">Legal Query Assistant with AI-Powered RAG</p>

        <div class="api-url-group">
            <label>API Endpoint URL:</label>
            <input type="text" id="apiUrl" value="https://turn2law-lawgpt-zzj3.onrender.com/api/query" placeholder="Enter your API URL">
        </div>

        <div class="input-group">
            <label for="query">Enter your legal query:</label>
            <textarea 
                id="query" 
                placeholder="e.g., What is the punishment for murder? or Explain IPC Section 420"
            ></textarea>
        </div>

        <button id="submitBtn" onclick="sendQuery()">Get Legal Answer</button>

        <div class="loading" id="loading">
            Processing your query...
        </div>

        <div id="response" class="response">
            <h3>Response:</h3>
            <div class="response-content" id="responseText"></div>
            <div class="model-info" id="modelInfo"></div>
        </div>
    </div>

    <script>
        async function sendQuery() {
            const query = document.getElementById('query').value.trim();
            const apiUrl = document.getElementById('apiUrl').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const responseDiv = document.getElementById('response');
            const responseText = document.getElementById('responseText');
            const modelInfo = document.getElementById('modelInfo');
            const loading = document.getElementById('loading');

            if (!query) {
                alert('Please enter a query');
                return;
            }

            if (!apiUrl) {
                alert('Please enter an API URL');
                return;
            }

            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            loading.classList.add('show');
            responseDiv.classList.remove('show', 'error');

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                responseText.textContent = data.response || 'No response received';
                modelInfo.textContent = `Model used: ${data.model_used}`;
                responseDiv.classList.add('show');
                responseDiv.classList.remove('error');
            } catch (error) {
                responseText.textContent = `Error: ${error.message}`;
                modelInfo.textContent = '';
                responseDiv.classList.add('show', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Get Legal Answer';
                loading.classList.remove('show');
            }
        }

        // Allow Enter key to submit (Ctrl+Enter or Cmd+Enter)
        document.getElementById('query').addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                sendQuery();
            }
        });
    </script>
</body>
</html>
